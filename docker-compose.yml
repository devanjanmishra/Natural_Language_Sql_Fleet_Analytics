services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: fleet_insight
      MYSQL_USER: fleet
      MYSQL_PASSWORD: fleetpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Optional — only needed for the semantic-search module (ENABLE_SEMANTIC=true)
  milvus:
    image: milvusdb/milvus:v2.4.9
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
    profiles: ["semantic"]

volumes:
  mysql_data:
